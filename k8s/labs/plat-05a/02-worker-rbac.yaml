apiVersion: v1
kind: ServiceAccount
metadata:
  name: saas-platform-worker
  namespace: saas-platform-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tenant-cluster-provisioner
  namespace: saas-tenant-databases
rules:
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters]
    verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-worker-provisioner
  namespace: saas-tenant-databases
subjects:
  - kind: ServiceAccount
    name: saas-platform-worker
    namespace: saas-platform-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tenant-cluster-provisioner
