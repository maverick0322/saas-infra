apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-lab-01
  namespace: cnpg-lab
  labels:
    app.kubernetes.io/part-of: saas-vital
    saas-vital.io/purpose: synthetic-db-test
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.12-system-trixie
  storage:
    storageClass: local-path
    size: 2Gi
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "750m"
      memory: "768Mi"
