apiVersion: apps/v1
kind: Deployment
metadata:
  name: saas-platform
  namespace: saas-vital
  labels:
    app.kubernetes.io/name: saas-platform
    app.kubernetes.io/part-of: saas-vital
  annotations:
    lab.saas-vital/gitops-validation: "enabled"

spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: saas-platform

  template:
    metadata:
      labels:
        app.kubernetes.io/name: saas-platform
        app.kubernetes.io/part-of: saas-vital

    spec:
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: platform
          image: ghcr.io/maverick0322/saas-platform@sha256:104c651cd22324935c161314a28aeb7fd8728090710ad355b26cd37842b00746
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
